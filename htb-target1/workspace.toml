# Doge Workspace Configuration
# Generated by 'workspace init'

[workspace]
name = "htb-target1"

[watcher]
debounce_ms = 300
ignore_patterns = [
    "*.tmp", "*.swp", "*.swo", "*~",
    ".git/**", ".doge/**", "node_modules/**",
]

[parser]
max_file_size_mb = 50

[database]
wal_mode = true
busy_timeout_ms = 5000

[cache]
max_entries = 1000
ttl_minutes = 60

[ai]
enabled = false
provider = "openai_compatible"
base_url = "http://localhost:11434/v1"
model = ""
context_window = 8192
max_response_tokens = 2048
temperature = 0.1
timeout_seconds = 120

[ai.verification]
require_evidence = true
max_speculation_ratio = 0.1

[logging]
level = "info"
format = "text"
redact_sensitive = true

[snapshot]
auto_interval_minutes = 60

[rules]
enabled = true
