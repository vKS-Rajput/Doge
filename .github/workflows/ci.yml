name: DOGE CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # Stage 1: Fast checks (fail early)
  # ─────────────────────────────────────────────
  check:
    name: Vet + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "::error::go.mod/go.sum not tidy" && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o /dev/null ./cmd/workspace/...

  # ─────────────────────────────────────────────
  # Stage 2: Full test suite
  # ─────────────────────────────────────────────
  test:
    name: Tests (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -count=1 -timeout 300s ./...

  # ─────────────────────────────────────────────
  # Stage 3: Race detection + coverage (Linux only)
  # ─────────────────────────────────────────────
  race-coverage:
    name: Race Detection + Coverage
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with race detector
        run: go test -race -count=1 -timeout 600s ./...

      - name: Generate coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -1
          echo ""
          echo "--- Per-package coverage ---"
          go tool cover -func=coverage.out | grep -E "^github" | sort -t'%' -k2 -rn | head -20

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

  # ─────────────────────────────────────────────
  # Stage 4: Security analysis
  # ─────────────────────────────────────────────
  security:
    name: Security Checks
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check for known vulnerabilities
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "=== Vulnerability Scan ==="
          echo "Note: stdlib vulnerabilities require a Go toolchain update."
          echo "       Dependency vulnerabilities require go.mod changes."
          echo ""
          govulncheck ./... || echo "::warning::govulncheck found vulnerabilities — review above output"

  # ─────────────────────────────────────────────
  # Stage 5: Integration test (Linux only)
  # ─────────────────────────────────────────────
  integration:
    name: Integration Test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: go build -o doge ./cmd/workspace/

      - name: Verify binary runs
        run: |
          ./doge version
          ./doge --help

      - name: Test workspace lifecycle
        run: |
          set -e

          # Create workspace
          mkdir -p /tmp/test-investigation
          cd /tmp/test-investigation

          # Initialize workspace
          $GITHUB_WORKSPACE/doge init test-target 2>&1 || true

          # Verify .doge directory was created
          if [ -d ".doge" ]; then
            echo "✓ Workspace initialized"
          else
            echo "⚠ Workspace init may have different behavior"
          fi

          # Verify database exists
          if [ -f ".doge/workspace.db" ]; then
            echo "✓ Database created"
          else
            echo "⚠ Database not found (may need start command)"
          fi

          echo ""
          echo "✓ Integration test complete"

      - name: Test runner pipeline
        run: go test -v -run TestEndToEnd ./internal/runner/...

      - name: Test learning pipeline
        run: go test -v -run TestLearningReplay ./internal/learning/...

  # ─────────────────────────────────────────────
  # Stage 6: Build release artifacts
  # ─────────────────────────────────────────────
  build-artifacts:
    name: Build Artifacts
    needs: [test, race-coverage]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          go build \
            -ldflags "-X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" \
            -o "doge-${{ matrix.suffix }}" \
            ./cmd/workspace/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: doge-${{ matrix.suffix }}
          path: doge-${{ matrix.suffix }}
          retention-days: 30
