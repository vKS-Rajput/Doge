# golangci-lint configuration
# See: https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m

linters:
  enable:
    - errcheck        # Check for unchecked errors
    - govet           # Reports suspicious constructs
    - staticcheck     # Advanced static analysis
    - unused          # Check for unused code
    - gosimple        # Simplify code suggestions
    - ineffassign     # Detect ineffectual assignments
    - typecheck       # Type-check Go code
    - gocritic        # Opinionated Go linter
    - gofmt           # Check formatting
    - misspell        # Find commonly misspelled English words
    - revive          # Replacement for golint
    - nilerr          # Find nil error returns
    - errname         # Check error naming conventions
    - errorlint       # Find errors not wrapped properly
    - exhaustive      # Check exhaustiveness of enum switch statements
    - prealloc        # Find slice preallocations
    - unconvert       # Remove unnecessary type conversions

linters-settings:
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - hugeParam       # Allow large structs as value params (domain types)

  revive:
    rules:
      - name: exported
        severity: warning
        arguments:
          - checkPrivateReceivers
      - name: blank-imports
      - name: context-as-argument
      - name: dot-imports
      - name: error-naming
      - name: error-return
      - name: error-strings
      - name: increment-decrement
      - name: var-naming
      - name: range
      - name: receiver-naming
      - name: indent-error-flow

  errcheck:
    check-type-assertions: true

  govet:
    enable-all: true
    disable:
      - fieldalignment  # Disable struct field alignment check (readability > padding)

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck       # Tests may intentionally ignore errors
        - gocritic
